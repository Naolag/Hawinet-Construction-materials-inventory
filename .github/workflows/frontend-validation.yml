name: Frontend validation

on:
  push:
    branches: [frontend/framer-replica-v2]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
